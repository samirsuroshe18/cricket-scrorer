name: cricket_scorer
description: "A powerful and easy-to-use cricket scoring app built with Flutter. Track live scores, manage teams, record ball-by-ball actions, and generate detailed match statistics—all in real time. Perfect for local matches, tournaments, and practice games."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5
  lucide_icons_flutter: ^3.1.13
  pretty_dio_logger: ^1.4.0
  floor: ^1.5.0
  sqflite: ^2.4.2
  flutter_native_splash: ^2.4.7
  json_annotation: ^4.9.0 # Do not change version ^4.9.0
  google_fonts: ^8.1.0
  lottie: ^3.3.3
  image_picker: ^1.2.2
  flutter_svg: ^2.3.0
  auto_size_text: ^3.0.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  cached_network_image: ^3.4.1
  ffmpeg_kit_flutter_new: ^4.3.2
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  socket_io_client: ^3.1.6
  uuid: ^4.6.0
  app_links: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  floor_generator: ^1.5.0
  build_runner: ^2.4.13    # Do not change version ^2.4.13
  json_serializable: ^6.8.0  # Do not change version ^6.8.0

flutter_native_splash:
  # --- Light Mode Configuration ---
  color: "#F7F7FA"
  image: assets/images/splash_logo.png
  branding: assets/images/brand_image.png

  # --- Dark Mode Configuration ---
  color_dark: "#121729"
  image_dark: assets/images/splash_logo.png
  branding_dark: assets/images/brand_image.png

  # --- Android 12+ Splash Screen API ---
  android_12:
    color: "#F7F7FA"
    image: assets/images/splash_logo.png
    branding: assets/images/brand_image.png

    color_dark: "#121729"
    image_dark: assets/images/splash_logo.png
    branding_dark: assets/images/brand_image.png

flutter:

  uses-material-design: true

  assets:
    - assets/gif/
    - assets/images/
    - assets/svg/
    - assets/json/

